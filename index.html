<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 기도동산</title>
<style>
body{margin:0;background:#F2F0EF;font-family:Arial,"Malgun Gothic",sans-serif;color:#333333}
.app{max-width:820px;margin:auto;background:#fff;min-height:100vh;box-shadow: 0 4px 20px rgba(75, 110, 72, 0.08);}
header{padding:20px;border-bottom:1px solid #E5E3E2;display:flex;flex-direction:column;gap:15px;background:#F9F8F7;}
@media(min-width:600px){header{flex-direction:row;justify-content:space-between;align-items:flex-start}}
main{padding:18px}
h1{margin:0 0 6px;font-size:22px;color:#4B6E48;}
.muted{color:#898989;font-size:13px}

/* 애니메이션 효과 정의 */
@keyframes breeze {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-6deg); }
  75% { transform: rotate(6deg); }
}
.animated-tree {
  display: inline-block;
  animation: breeze 3s ease-in-out infinite;
  transform-origin: bottom center;
}

/* 아멘 & 꽃가루 폭죽 애니메이션 스타일 (카드 기준 절대 좌표 및 여유로운 속도) */
.card {
  position: relative;
  border: 1px solid #E5E3E2;
  border-radius: 14px;
  padding: 16px;
  margin: 10px 0;
  background: #FFFFFF;
  box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  overflow: visible !important;
}

@keyframes popUpAmen {
  0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
  25% { transform: translate(-50%, -35px) scale(1.2); opacity: 1; }
  75% { transform: translate(-50%, -55px) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -75px) scale(0.9); opacity: 0; }
}

@keyframes popUpConfetti {
  0% { transform: translate(0, 0) scale(0.9) rotate(0deg); opacity: 1; }
  75% { transform: translate(var(--tx), var(--ty)) scale(0.6) rotate(360deg); opacity: 1; }
  100% { transform: translate(var(--tx), calc(var(--ty) + 15px)) scale(0.3) rotate(540deg); opacity: 0; }
}

.popup-amen {
  position: absolute;
  font-weight: bold;
  font-size: 16px;
  color: #4B6E48;
  pointer-events: none;
  animation: popUpAmen 3s ease-out forwards;
  white-space: nowrap;
  z-index: 100;
  text-shadow: 0 1px 4px rgba(255,255,255,0.9);
}

.confetti-particle {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  pointer-events: none;
  animation: popUpConfetti 3s ease-out forwards;
  z-index: 99;
}

/* 1줄 고정 균등 분할 버튼바 */
.bar{display:flex;flex-wrap:nowrap;gap:6px;margin:14px 0;width:100%;box-sizing:border-box;}
.btn{padding:10px 4px;border:1px solid #D5D1CE;border-radius:9px;background:#F2F0EF;color:#4B6E48;cursor:pointer;flex:1;text-align:center;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition: all 0.2s; box-sizing: border-box;}
.btn:hover{background:#E5E3E2;}
.primary{background:#4B6E48;color:#fff;border-color:#3A5638;}
.primary:hover{background:#3A5638;}

.meta{display:flex;justify-content:space-between;color:#898989;font-size:13px}
.title{font-size:17px;margin:12px 0;color:#333333;}
.actions{text-align:right;display:flex;justify-content:space-between;gap:6px;width:100%;}
.btn-wrapper{display:flex;flex:1;}
.done{background:#F9F8F7;opacity:.85;border-color:#D5D1CE;}
.modal{display:none;position:fixed;inset:0;background:#0005;align-items:center;justify-content:center;padding:15px;z-index:100;}
.box{background:#fff;border-radius:15px;padding:20px;width:min(480px,100%);box-shadow: 0 10px 30px rgba(0,0,0,0.1);}
label{display:block;font-size:13px;margin:12px 0 5px;color:#4B6E48;font-weight:bold;}
input,select{width:100%;padding:10px;border:1px solid #D5D1CE;border-radius:8px;font:inherit;box-sizing:border-box;background:#F9F8F7;}
textarea{width:100%;padding:10px;border:1px solid #D5D1CE;border-radius:8px;font:inherit;min-height:90px;resize:none;box-sizing:border-box;background:#F9F8F7;}
.empty{text-align:center;padding:50px;color:#898989}

/* 기도동산 성장 정보 카드 배지 스타일 */
.forest-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #F2F0EF;
  border: 1px solid #D5D1CE;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 13px;
  color: #4B6E48;
  font-weight: bold;
  margin-bottom: 8px;
}

/* 월 선택 드롭다운 및 잔디밭 스타일 */
.calendar-container{background:#F9F8F7;border:1px solid #E5E3E2;border-radius:10px;padding:10px;width:100%;box-sizing:border-box;}
@media(min-width:600px){.calendar-container{max-width:420px;}}
.cal-header{display:flex;justify-content:flex-end;align-items:center;margin-bottom:6px}
.cal-select{padding:4px 8px;font-size:12px;border:1px solid #D5D1CE;border-radius:6px;background:#fff;color:#4B6E48;cursor:pointer;width:auto;}
.cal-row{display:flex;justify-content:space-between;gap:2px;margin-bottom:2px}
.cal-day{flex:1;height:22px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#898989;background:#fff;border:1px solid #E5E3E2;border-radius:3px;box-sizing:border-box;transition: all 0.1s;}
.cal-day:hover{border-color:#B2AC88;}
.cal-day.completed{background:#B2AC88;border-color:#8C8666;color:#FFFFFF;font-weight:bold}

#loginScreen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:20px;text-align:center;}
</style>

<!-- Firebase SDK CDN (v10 방식) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBui-_SN0UNTjn1L9ugqK8J5cBSApeCQL8",
    authDomain: "dailyprayerpoints.firebaseapp.com",
    projectId: "dailyprayerpoints",
    storageBucket: "dailyprayerpoints.firebasestorage.app",
    messagingSenderId: "771709668836",
    appId: "1:771709668836:web:b892db634561a03e9d8bf1",
    measurementId: "G-MPLQF4D7R1"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let items = [],
      cats = ["전체","자신","가족","교회"],
      edit = null,
      thanksEditId = null,
      currentUser = null;

  window.currentFilter = "전체";
  let selectedYear = new Date().getFullYear();
  let selectedMonth = new Date().getMonth();
  let selectedDate = new Date().toISOString().slice(0, 10);

  const today = () => new Date().toISOString().slice(0, 10),
        fmt = x => x.replaceAll("-", "."),
        save = async () => { 
          if (!currentUser) return;
          try {
            await setDoc(doc(db, "users", currentUser.uid, "prayerData", "main"), { items: items });
          } catch (e) {
            console.error("저장 실패:", e);
          }
        };

  function esc(x) { return String(x).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }
  function days(x) { return Math.max(1, Math.floor((new Date(today()) - new Date(x)) / 864e5) + 1); }

  function getValidPrayerCount(x) {
    if (!x.logs) return 0;
    return Object.entries(x.logs).filter(([date, status]) => status && date >= x.createdAt).length;
  }

  function getTreeStageInfo(x) {
    if (x.responded) {
      return { emoji: "🍎", name: "응답의 열매", desc: "기도가 응답되어 열매가 맺혔어요!" };
    }
    const d = days(x.createdAt);
    if (d <= 3) return { emoji: "🌰", name: "씨앗", desc: "땅속에서 조용히 싹을 준비하는 중" };
    if (d <= 7) return { emoji: "🌱", name: "아기 새싹", desc: "연두색 고개를 살짝 내민 새싹" };
    if (d <= 14) return { emoji: "🌿", name: "어린 잎", desc: "줄기가 튼튼해지는 중" };
    if (d <= 30) return { emoji: "🪴", name: "작은 묘목", desc: "제법 모양을 갖춘 묘목" };
    if (d <= 60) return { emoji: "🌲", name: "푸른 나무", desc: "가지가 푸르게 뻗어가는 나무" };
    if (d <= 90) return { emoji: "🌳", name: "성숙한 나무", desc: "든든하게 뿌리내린 나무" };
    if (d <= 180) return { emoji: "🪵", name: "거목", desc: "굵은 나이테가 생긴 든든한 거목" };
    if (d <= 365) return { emoji: "🌳", name: "참나무", desc: "사계절을 견뎌낸 우람한 나무" };
    return { emoji: "👑", name: "수호목", desc: "1년 이상 깊은 역사가 담긴 동산의 수호목" };
  }

  window.loginWithGoogle = async function() {
    const provider = new GoogleAuthProvider();
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      console.error("로그인 실패:", e);
    }
  }

  window.logout = async function() {
    try {
      await signOut(auth);
    } catch (e) {
      console.error("로그아웃 실패:", e);
    }
  }

  window.setFilter = function(c) {
    window.currentFilter = c;
    render();
  }

  window.changeMonth = function(val) {
    const [y, m] = val.split('-');
    selectedYear = parseInt(y);
    selectedMonth = parseInt(m);
    renderCalendar();
  }

  window.selectCalendarDate = function(dStr) {
    selectedDate = dStr;
    render();
  }

  function initMonthSelect() {
    const select = document.getElementById("calMonthSelect");
    let options = '';
    const now = new Date();
    for (let i = 0; i < 24; i++) {
      let d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      let y = d.getFullYear();
      let m = d.getMonth();
      let val = `${y}-${m}`;
      let text = `${y}년 ${m + 1}월`;
      options += `<option value="${val}" ${y === selectedYear && m === selectedMonth ? 'selected' : ''}>${text}</option>`;
    }
    select.innerHTML = options;
  }

  function renderCalendar() {
    const year = selectedYear;
    const month = selectedMonth;
    const lastDayDate = new Date(year, month + 1, 0).getDate();

    let row1 = '', row2 = '';
    let activeItems = items.filter(x => !x.responded);

    for (let day = 1; day <= lastDayDate; day++) {
      const dStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      
      let isCompleted = false;
      if (activeItems.length > 0) {
        const targetPrayers = activeItems.filter(x => x.createdAt <= dStr);
        if (targetPrayers.length > 0) {
          isCompleted = targetPrayers.every(x => {
            return x.logs && x.logs[dStr] && dStr >= x.createdAt;
          });
        }
      }

      const isSelected = (dStr === selectedDate);
      const selectedStyle = isSelected ? 'border: 2px solid #4B6E48; font-weight: bold; background-color: #E5E3E2;' : '';
      const dayHtml = `<div class="cal-day ${isCompleted ? 'completed' : ''}" style="${selectedStyle} cursor: pointer;" onclick="selectCalendarDate('${dStr}')">${day}</div>`;
      
      if (day <= 15) { row1 += dayHtml; } else { row2 += dayHtml; }
    }

    document.getElementById("calRow1").innerHTML = row1;
    document.getElementById("calRow2").innerHTML = row2;
  }

  window.render = function() {
    const now = new Date();
    const formatter = new Intl.DateTimeFormat("ko-KR", { year: 'numeric', month: 'long', day: 'numeric' });
    const weekdayFormatter = new Intl.DateTimeFormat("ko-KR", { weekday: 'short' });
    
    document.getElementById("today").textContent = `${formatter.format(now)} (${weekdayFormatter.format(now)})`;
    
    renderCalendar();

    let active = items.filter(x => !x.responded),
        done = active.filter(x => x.logs && x.logs[selectedDate] && selectedDate >= x.createdAt).length;
    
    document.getElementById("summary").innerHTML = `${fmt(selectedDate)} 기준 (${done}/${active.length}개 완료) · 기도응답 ${items.filter(x => x.responded).length}건`;
    
    let allButtonsHtml = `
      <button class="btn primary" onclick="openForm()">추가</button>
      <button class="btn ${window.currentFilter === '응답' ? 'primary' : ''}" onclick="showResponses()">응답</button>
    ` + cats.map(c => `<button class="btn ${window.currentFilter === c ? 'primary' : ''}" onclick="setFilter('${esc(c)}')">${esc(c)}</button>`).join("");
    
    document.getElementById("actionButtonsBar").innerHTML = allButtonsHtml;
    
    let a = active.filter(x => window.currentFilter === "전체" || x.category === window.currentFilter);
    document.getElementById("list").innerHTML = a.length ? a.map(x => {
      let d = x.logs && x.logs[selectedDate] && selectedDate >= x.createdAt, 
          n = getValidPrayerCount(x),
          stage = getTreeStageInfo(x);
      return `<div class="card ${d ? "done" : ""}" id="card-${x.id}">
        <div class="meta"><span>${esc(x.category)}</span><span>작성 ${fmt(x.createdAt)} · ${days(x.createdAt)}일째</span></div>
        <div style="margin-top:10px;">
          <span class="forest-badge"><span class="animated-tree">${stage.emoji}</span> ${stage.name} (${days(x.createdAt)}일째)</span>
        </div>
        <div class="title">${esc(x.title)}</div>
        <div class="muted">실제 기도 ${n}일 · ${stage.desc}</div>
        <div class="actions" style="margin-top:12px;">
          <button class="btn" style="flex:1;" onclick="editPrayer('${x.id}')">수정</button>
          <div class="btn-wrapper" id="wrap-${x.id}">
            <button class="btn" style="width:100%;" id="btn-${x.id}" onclick="toggle('${x.id}', event)">${d ? "✓ 기도함" : "□ 기도하기"}</button>
          </div>
          <button class="btn" style="flex:1;" onclick="respond('${x.id}')">응답됨</button>
        </div>
      </div>`;
    }).join("") : '<div class="empty">기도동산에 심어진 나무가 없어요. 기도제목을 추가해 보세요! 🌱</div>';
  }

  window.openForm = function(x = null) {
    edit = x?.id || null;
    document.getElementById("formTitle").textContent = x ? "기도제목 수정" : "기도제목 추가";
    document.getElementById("title").value = x?.title || "";
    document.getElementById("created").value = x?.createdAt || today();
    
    let targetCats = cats.filter(c => c !== "전체");
    document.getElementById("cat").innerHTML = targetCats.map(c => `<option>${esc(c)}</option>`).join("");
    document.getElementById("cat").value = x?.category || targetCats[0];
    
    const deleteBtn = document.getElementById("deleteBtn");
    if (x) { deleteBtn.style.display = "inline-block"; } else { deleteBtn.style.display = "none"; }

    document.getElementById("modal").style.display = "flex";
  }

  window.closeForm = function() { document.getElementById("modal").style.display = "none"; }
  window.editPrayer = function(id) { openForm(items.find(x => x.id === id)); }

  window.savePrayer = async function() {
    let t = document.getElementById("title").value.trim();
    if (!t) return alert("기도제목을 입력해주세요.");
    let c = document.getElementById("cat").value,
        d = document.getElementById("created").value || today();
    if (edit) {
      let x = items.find(x => x.id === edit);
      Object.assign(x, { title: t, category: c, createdAt: d });
    } else {
      items.push({ id: crypto.randomUUID(), title: t, category: c, createdAt: d, logs: {}, responded: false });
    }
    await save(); closeForm(); render();
  }

  window.deletePrayer = async function() {
    if (!edit) return;
    if (confirm("이 기도제목을 정말 삭제하시겠습니까?")) {
      items = items.filter(x => x.id !== edit);
      await save();
      closeForm();
      render();
    }
  }

  // 기도 완료 버튼 클릭 시 애니메이션 효과 실행 함수 (카드 기준 영역에서 충분히 눈에 띄게 표시)
  function triggerAmenAnimation(cardEl, btnEl) {
    const cardRect = cardEl.getBoundingClientRect();
    const btnRect = btnEl.getBoundingClientRect();
    
    const centerX = (btnRect.left + btnRect.right) / 2 - cardRect.left;
    const centerY = btnRect.top - cardRect.top;

    // 아멘 텍스트 생성
    const amenEl = document.createElement("div");
    amenEl.className = "popup-amen";
    amenEl.style.left = `${centerX}px`;
    amenEl.style.top = `${centerY}px`;
    amenEl.textContent = "🙏 아멘!";
    cardEl.appendChild(amenEl);
    setTimeout(() => amenEl.remove(), 1800);

    // 색색의 꽃가루(파티클) 생성
    const colors = ["#4B6E48", "#B2AC88", "#E3A857", "#D98880", "#85C1E9", "#F39C12", "#E74C3C"];
    for (let i = 0; i < 18; i++) {
      const p = document.createElement("div");
      p.className = "confetti-particle";
      p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      p.style.left = `${centerX}px`;
      p.style.top = `${centerY}px`;
      
      const angle = Math.random() * Math.PI * 2;
      const distance = 40 + Math.random() * 55;
      const tx = Math.cos(angle) * distance + "px";
      const ty = Math.sin(angle) * distance - 30 + "px";
      
      p.style.setProperty("--tx", tx);
      p.style.setProperty("--ty", ty);
      
      cardEl.appendChild(p);
      setTimeout(() => p.remove(), 1800);
    }
  }

 window.toggle = async function(id, event) {
    let x = items.find(x => x.id === id);
    x.logs = x.logs || {};
    if (selectedDate < x.createdAt) {
      return alert("작성일 이전에는 기도 체크를 할 수 없습니다.");
    }
    
    const wasCompleted = !!x.logs[selectedDate];
    x.logs[selectedDate] = !wasCompleted;

    // 미체크 상태에서 체크 상태로 바뀔 때 애니메이션 실행
    if (!wasCompleted && x.logs[selectedDate]) {
      const cardEl = document.getElementById(`card-${id}`);
      const btnEl = document.getElementById(`btn-${id}`);
      if (cardEl && btnEl) {
        triggerAmenAnimation(cardEl, btnEl);
      }
    }

    // 데이터는 즉시 백그라운드 저장하되, 
    // 화면 전체 리렌더링은 애니메이션이 충분히 보일 수 있도록 0.5초 뒤에 실행
    await save(); 
    setTimeout(() => {
      render();
    }, 500);
  }

  window.respond = async function(id) {
    let x = items.find(x => x.id === id);
    if (confirm("기도응답 열매 맺기 동산으로 이동할까요?")) {
      x.responded = true;
      x.responseDate = today();
      x.thanks = "";
      await save();
      showResponses();
    }
  }

  window.showResponses = function() {
    window.currentFilter = "응답";
    
    let allButtonsHtml = `
      <button class="btn primary" onclick="openForm()">추가</button>
      <button class="btn ${window.currentFilter === '응답' ? 'primary' : ''}" onclick="showResponses()">응답</button>
    ` + cats.map(c => `<button class="btn ${window.currentFilter === c ? 'primary' : ''}" onclick="setFilter('${esc(c)}')">${esc(c)}</button>`).join("");
    document.getElementById("actionButtonsBar").innerHTML = allButtonsHtml;

    document.getElementById("list").innerHTML = items.filter(x => x.responded).map(x => `
      <div class="card">
        <div class="meta">
          <span>${esc(x.category)}</span>
          <span>시작 ${fmt(x.createdAt)} · 응답 ${fmt(x.responseDate || today())}</span>
        </div>
        <div style="margin-top:10px;">
          <span class="forest-badge"><span class="animated-tree">🍎</span> 응답의 열매 (총 ${days(x.createdAt)}일의 여정)</span>
        </div>
        <div class="title">${esc(x.title)}</div>
        <div class="muted">총 기도 ${getValidPrayerCount(x)}일</div>
        <p style="margin:10px 0 14px; font-size:14px; color:#444;">${esc(x.thanks || "감사 기록 없음")}</p>
        <div class="actions">
          <button class="btn" style="flex:1;" onclick="openThanksModal('${x.id}')">감사 기록</button>
          <button class="btn" style="flex:1;" onclick="restore('${x.id}')">다시 기도동산으로</button>
        </div>
      </div>
    `).join("") || '<div class="empty">응답된 열매가 아직 없습니다.</div>';
  }

  window.openThanksModal = function(id) {
    thanksEditId = id;
    let x = items.find(item => item.id === id);
    document.getElementById("thanksText").value = x?.thanks || "";
    document.getElementById("thanksModal").style.display = "flex";
  }

  window.closeThanksModal = function() {
    document.getElementById("thanksModal").style.display = "none";
    thanksEditId = null;
  }

  window.saveThanks = async function() {
    if (!thanksEditId) return;
    let x = items.find(item => item.id === thanksEditId);
    if (x) {
      x.thanks = document.getElementById("thanksText").value.trim();
      await save();
    }
    closeThanksModal();
    showResponses();
  }

  window.restore = async function(id) {
    let x = items.find(x => x.id === id);
    x.responded = false;
    x.responseDate = null;
    await save();
    window.currentFilter = "전체";
    render();
  }

  onAuthStateChanged(auth, async (user) => {
    currentUser = user;
    const mainApp = document.getElementById("mainApp");
    const loginScreen = document.getElementById("loginScreen");

    if (user) {
      loginScreen.style.display = "none";
      mainApp.style.display = "block";

      items = [];
      try {
        const docRef = doc(db, "users", user.uid, "prayerData", "main");
        const docSnap = await getDoc(docRef);
        if (docSnap.exists() && docSnap.data().items) {
          items = docSnap.data().items;
        }
      } catch (e) {
        console.error("데이터 로드 실패:", e);
      }
      initMonthSelect();
      render();
    } else {
      mainApp.style.display = "none";
      loginScreen.style.display = "flex";
    }
  });
</script>
</head>
<body>
<!-- 로그인 화면 -->
<div id="loginScreen">
  <div class="box" style="max-width:360px;">
    <h2>나의 기도동산 🌿</h2>
    <p class="muted" style="margin-bottom:20px;">로그인하여 나만의 기도의 동산을 가꿔보세요.</p>
    <button class="btn primary" style="width:100%; padding:12px;" onclick="loginWithGoogle()">Google 계정으로 로그인</button>
  </div>
</div>

<!-- 메인 앱 화면 -->
<div id="mainApp" class="app" style="display:none;">
  <header>
    <div>
      <h1>나의 기도동산 🌲</h1>
      <div id="today" class="muted"></div>
      <button class="btn" style="margin-top:10px; font-size:11px; padding:4px 10px;" onclick="logout()">로그아웃</button>
    </div>
    <div class="calendar-container">
      <div class="cal-header">
        <select id="calMonthSelect" class="cal-select" onchange="changeMonth(this.value)"></select>
      </div>
      <div id="calRow1" class="cal-row"></div>
      <div id="calRow2" class="cal-row"></div>
    </div>
  </header>
  <main>
    <div id="summary" style="font-weight:bold; color:#4B6E48; margin-bottom:8px;"></div>
    <div id="actionButtonsBar" class="bar"></div>
    <div id="list"></div>
  </main>
</div>

<!-- 기본 모달 팝업 (기도 추가/수정) -->
<div id="modal" class="modal">
  <div class="box">
    <h2 id="formTitle" style="color:#4B6E48; margin-top:0;">기도제목 추가</h2>
    <label>카테고리</label>
    <select id="cat"></select>
    <label>기도제목</label>
    <textarea id="title"></textarea>
    <label>작성일</label>
    <input id="created" type="date">
    <div class="bar" style="justify-content: space-between; margin-top: 20px;">
      <button id="deleteBtn" class="btn" style="background:#F2F0EF; border-color:#D5D1CE; color:#898989; display:none;" onclick="deletePrayer()">삭제</button>
      <div style="display:flex; gap:8px; margin-left:auto;">
        <button class="btn" onclick="closeForm()">취소</button>
        <button class="btn primary" onclick="savePrayer()">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- 감사 기록 전용 모달 팝업 -->
<div id="thanksModal" class="modal">
  <div class="box">
    <h2 style="color:#4B6E48; margin-top:0;">응답 열매 감사 기록</h2>
    <label>감사 내용</label>
    <textarea id="thanksText" placeholder="응답하신 하나님, 감사합니다."></textarea>
    <div class="bar" style="justify-content: flex-end; margin-top: 20px;">
      <button class="btn" onclick="closeThanksModal()">취소</button>
      <button class="btn primary" onclick="saveThanks()">저장</button>
    </div>
  </div>
</div>
</body>
</html>
